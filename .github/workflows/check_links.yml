name: Check docs links

on:
  schedule:
    - cron: "30 05 * * *"
  workflow_dispatch: ~

jobs:
  check_links:
    # Runs in the monorepo only (scalableminds/mono), which publishes the docs.
    if: github.repository == 'scalableminds/mono'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
      - name: Check links
        env:
          SLACK_HOOK: ${{ secrets.LINK_CHECKER_SLACK_HOOK }}
        run: |
          cd docs
          uv run --frozen linkchecker --config linkcheckerrc https://docs.webknossos.org > link_status || \
            curl -X POST --data-urlencode "payload={\"text\": \":warning: Broken Links on doc.webknossos.org :warning:\n"'```'"\n$(cat link_status)\n"'```"}' \
              "$SLACK_HOOK"
