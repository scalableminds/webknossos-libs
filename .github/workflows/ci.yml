name: CI

on:
  push:
    branches:
      - master
    tags:
      - "**"
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      webknossos: ${{ steps.filter.outputs.webknossos || github.ref ==
        'refs/heads/master' }}
      cluster_tools: ${{ steps.filter.outputs.cluster_tools || github.ref ==
        'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            webknossos:
              - 'webknossos/**'
            cluster_tools:
              - 'cluster_tools/**'

  cluster_tools_slurm:
    needs: changes
    if: ${{ needs.changes.outputs.cluster_tools == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.14", "3.13", "3.12", "3.11"]
    defaults:
      run:
        working-directory: cluster_tools
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "cluster_tools/uv.lock"
          # Restore only: The cache from `cluster_tools_other` is used.
          save-cache: false
      - run: uv python install ${{ matrix.python-version }}
      - name: Start Docker Cluster
        run: cd ./dockered-slurm && docker compose up -d
      - name: Log Core Container
        run: |
          for name in "slurmctld" "c1" "c2"; do
            docker logs "$name"
          done
      - name: Install UV dependencies
        run: |
          for name in "slurmctld" "c1" "c2"; do
            docker exec -w /cluster_tools "$name" bash -c "uv sync --frozen"
          done
      - name: "Run Tests (test_all, test_slurm) without modified slurm.conf"
        run: |
          docker exec \
            -w /cluster_tools/tests \
            -e PYTEST_EXECUTORS=slurm \
            slurmctld bash -c "uv run --frozen python -m pytest -sv test_all.py test_slurm.py -m 'not requires_modified_slurm_config'"
      - name: "Run Tests (test_deref_main)"
        run: |
          docker exec \
            -w /cluster_tools/tests \
            slurmctld bash -c "uv run --frozen python test_deref_main.py"

      - name: Update Slurm Config
        run: |
          echo "MaxArraySize=2" >> ./dockered-slurm/slurm.conf
          sed "s/JobAcctGatherFrequency=30/JobAcctGatherFrequency=1/g" ./dockered-slurm/slurm.conf > ./dockered-slurm/slurm.conf.tmp
          mv ./dockered-slurm/slurm.conf.tmp ./dockered-slurm/slurm.conf
      - name: Restart Slurm Cluster
        run: cd ./dockered-slurm && docker compose restart slurmctld c1 c2

      - name: "Run Tests (test_all, test_slurm) with modified slurm.conf"
        run: |
          # Run tests requiring a modified slurm config
          docker exec \
            -w /cluster_tools/tests \
            -e PYTEST_EXECUTORS=slurm \
            slurmctld bash -c "uv run --frozen python -m pytest -sv test_slurm.py -m 'requires_modified_slurm_config'"

  cluster_tools_other:
    needs: changes
    if: ${{ needs.changes.outputs.cluster_tools == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.14", "3.13", "3.12", "3.11"]
    defaults:
      run:
        working-directory: cluster_tools
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "cluster_tools/uv.lock"
          save-cache: ${{ matrix.python-version == '3.11' }}
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies (without docker)
        run: uv sync --frozen
      - name: Check typing
        if: ${{ matrix.python-version == '3.11' }}
        run: ./typecheck.sh
      - name: Check formatting
        if: ${{ matrix.python-version == '3.11' }}
        run: ./format.sh check
      - name: Lint code
        if: ${{ matrix.python-version == '3.11' }}
        run: ./lint.sh
      - name: Run multiprocessing tests
        run: |
          cd tests
          PYTEST_EXECUTORS=multiprocessing,sequential,multiprocessing_with_pickling,sequential_with_pickling \
            uv run --frozen python -m pytest -sv test_all.py test_multiprocessing.py
      - name: Run batching tests
        run: |
          cd tests
          uv run --frozen python -m pytest -sv test_batching.py

  test_data:
    # Downloads the 1.2 GB l4_sample archive once into the cache, so that the
    # parallel webknossos_linux jobs don't all download it from the file host.
    needs: changes
    if: |
      ${{ needs.changes.outputs.cluster_tools == 'true' }} ||
      ${{ needs.changes.outputs.webknossos == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webknossos

    steps:
      - name: Look up cached test data
        id: test-data-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/webknossos-libs-test/l4_sample.zip
          key: l4-sample-zarr-v3-v2
          lookup-only: true

      - uses: actions/checkout@v7
        if: ${{ steps.test-data-cache.outputs.cache-hit != 'true' }}

      - name: Install uv
        if: ${{ steps.test-data-cache.outputs.cache-hit != 'true' }}
        uses: astral-sh/setup-uv@v10.3.3

      - name: Download test data
        if: ${{ steps.test-data-cache.outputs.cache-hit != 'true' }}
        run: uv run --no-project --with requests python -c "import test; test.download_test_data('~/.cache/webknossos-libs-test')"

      - name: Save test data
        if: ${{ steps.test-data-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/webknossos-libs-test/l4_sample.zip
          key: l4-sample-zarr-v3-v2

  webknossos_linux:
    needs: [changes, test_data]
    if: |
      ${{ needs.changes.outputs.cluster_tools == 'true' }} ||
      ${{ needs.changes.outputs.webknossos == 'true' }}
    runs-on: ubicloud-standard-8
    strategy:
      matrix:
        python-version: ["3.14", "3.13", "3.12", "3.11"]
        group: [1, 2, 3]
      fail-fast: false
    defaults:
      run:
        working-directory: webknossos

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "webknossos/uv.lock"
          # Every matrix job resolves the same cache key, so let a single job
          # write it instead of having the rest race and warn.
          save-cache: ${{ matrix.group == 1 && matrix.python-version == '3.11' }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Check formatting
        if: ${{ matrix.group == 1 && matrix.python-version == '3.11' }}
        run: ./format.sh check

      - name: Lint code
        if: ${{ matrix.group == 1 && matrix.python-version == '3.11' }}
        run: ./lint.sh

      - name: Check typing
        if: ${{ matrix.group == 1 && matrix.python-version == '3.11' }}
        run: ./typecheck.sh

      - name: Patch Python standard library to assert that fork is not allowed
        run: |
          sed -i '/def _launch/a\ \ \ \ \ \ \ \ raise Exception("fork is not allowed.")' ${UV_PYTHON_INSTALL_DIR}/cpython-${{ matrix.python-version }}.*-linux-x86_64-gnu/lib/python${{ matrix.python-version }}/multiprocessing/popen_fork.py
          cat ${UV_PYTHON_INSTALL_DIR}/cpython-${{ matrix.python-version }}.*-linux-x86_64-gnu/lib/python${{ matrix.python-version }}/multiprocessing/popen_fork.py

      - name: Restore test data
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/webknossos-libs-test/l4_sample.zip
          key: l4-sample-zarr-v3-v2

      - name: Python tests
        timeout-minutes: 30
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          WK_TEST_DATA_CACHE_DIR: ~/.cache/webknossos-libs-test
        run:
          uv run test.py --splits 3 --group ${{ matrix.group }} --splitting-algorithm
          least_duration

      - name: Check if git is dirty
        run: ../_tooling/check_clean.sh

  webknossos_windows:
    needs: changes
    if: |
      ${{ needs.changes.outputs.cluster_tools == 'true' }} ||
      ${{ needs.changes.outputs.webknossos == 'true' }}
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12"]
        group: [1, 2, 3]
      fail-fast: false
    defaults:
      run:
        working-directory: webknossos

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "webknossos/uv.lock"
          save-cache: ${{ matrix.group == 1 }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Python tests
        timeout-minutes: 30
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          MULTIPROCESSING_DEFAULT_START_METHOD: spawn
        run:
          uv run test.py --splits 3 --group ${{ matrix.group }} --splitting-algorithm
          least_duration

  docs:
    needs:
      - cluster_tools_slurm
      - cluster_tools_other
      - webknossos_linux
      - webknossos_windows
    runs-on: ubuntu-latest
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      !github.event.pull_request.head.repo.fork

    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: scalableminds/webknossos
          path: docs/wk-repo
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Build Docs
        run: |
          cd docs
          ./generate.sh --persist

      # Publishing happens in the monorepo only (scalableminds/mono), where these workflows run too.
      - name: Push docs (for master)
        if: github.ref == 'refs/heads/master' && github.repository == 'scalableminds/mono'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          CI_BRANCH=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          NORMALIZED_CI_BRANCH=${CI_BRANCH//[\/-]/_}
          uvx --from awscli aws s3 cp --recursive --endpoint-url https://eu-central-2.storage.impossibleapi.net docs/out s3://webknossos-www/docs/${NORMALIZED_CI_BRANCH}

      - name: Push docs (for tag)
        if: github.ref_type == 'tag' && github.repository == 'scalableminds/mono'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          N8N_TOKEN: ${{ secrets.N8N_USERNAME }}
          N8N_USERNAME: ${{ secrets.N8N_TOKEN }}
        run: |
          # the monorepo's release tags are webknossos-libs/vX.Y.Z
          CI_TAG=${GITHUB_REF_NAME#webknossos-libs/}
          set -e

          uvx --from awscli aws s3 cp --recursive --endpoint-url https://eu-central-2.storage.impossibleapi.net docs/out s3://webknossos-www/docs/${CI_TAG}
          curl --basic -u "${N8N_TOKEN}:${N8N_USERNAME}" https://docs.webknossos.org/webhooks/index-docs

  pypi_and_gh_release:
    needs:
      - cluster_tools_slurm
      - cluster_tools_other
      - webknossos_linux
      - webknossos_windows
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      github.ref_type == 'tag' &&
      github.repository == 'scalableminds/mono' &&
      !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Publish python packages
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_PASSWORD }}
        run: _tooling/publish.sh
      - name: Prepare github release
        run: |
          VERSION="$(uvx dunamai from git --pattern-prefix '(?:webknossos-libs/)?')"
          _tooling/changelog_for_version.sh $VERSION > Changelog.md
      - name: Publish github release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: Changelog.md
          draft: false
          prerelease: false

  complete:
    needs:
      - cluster_tools_other
      - cluster_tools_slurm
      - test_data
      - webknossos_linux
      - webknossos_windows
      - docs
      - pypi_and_gh_release
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check failure
        if: |
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Success
        run: echo Success!
