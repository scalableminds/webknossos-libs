name: nightly

on:
  schedule:
    - cron: "00 06 * * *"
  workflow_dispatch: ~

jobs:
  webknossos_nightly:
    runs-on: ubicloud-standard-8
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false
    defaults:
      run:
        working-directory: webknossos

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Check if git is dirty
        run: |
          git diff --no-ext-diff --quiet --exit-code
          [[ -z $(git status -s) ]]

      - name: Python tests
        env:
          WK_TOKEN: ${{ secrets.WK_TOKEN }}
        # `-n0` disables xdist: pytest-split cannot collect durations from workers.
        run: uv run test.py --store-durations -n0

      # `.test_durations` decides how balanced the three CI groups are, so a
      # fresh one is uploaded here to keep the drift visible.
      - name: Persist test durations
        if: ${{ matrix.python-version == '3.11' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-durations
          path: "webknossos/.test_durations"
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - uses: slackapi/slack-github-action@v3.0.1
        if: failure() || cancelled()
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            attachments:
              - color: "#f00"
                blocks:
                  - type: "section"
                    text:
                      type: "mrkdwn"
                      text: ':fire: Job <${{github.server_url}}/${{github.repository}}/actions/runs/${{github.run_id}}|${{github.job}}> of workflow "${{github.workflow}}" failed'
                  - type: "context"
                    elements:
                      - type: mrkdwn
                        text: '<${{github.repositoryUrl}}|${{github.repository}}>'
